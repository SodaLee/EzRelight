[project]
name = "ezrelight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cupy-cuda12x>=13.6.0",
    "datasets>=4.4.1",
    "deepspeed>=0.18.3",
    "diffusers==0.32.0",
    "einops>=0.8.1",
    "ftfy>=6.3.1",
    "hydra-core>=1.3.2",
    "imageio[ffmpeg]>=2.37.2",
    "lightning>=2.6.0",
    "matplotlib>=3.10.8",
    "modelscope>=1.33.0",
    "ninja>=1.13.0",
    "onnxruntime>=1.23.2",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "pillow>=12.0.0",
    "piq>=0.8.0",
    "protobuf>=6.33.2",
    "rich>=14.2.0",
    "safetensors>=0.7.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "sentencepiece>=0.2.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.57.3",
    "xformers==0.0.29",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
xformers  = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
